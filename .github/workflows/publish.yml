# Publishes to PyPI when a GitHub release is published.
#
# No token anywhere: PyPI trusts this repo + this workflow file + the `pypi`
# environment (Trusted Publishing, configured on pypi.org under the project's
# Publishing settings). The `pypi` environment requires a reviewer, so every
# upload waits for a manual Approve on GitHub.
#
# To release: bump version in setup.py (+ CHANGELOG), push, then
#   gh release create v1.2.3 --generate-notes
# The tag (minus a leading "v" / "v_") must match the setup.py version.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install build -r requirements.txt
      - name: Test
        run: PYTHONWARNINGS=ignore python -m unittest wordstats.tests.test_basics -v
      - name: Build
        run: python -m build
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"; tag="${tag#_}"
          ls dist/wordstats-"$tag".tar.gz dist/wordstats-"$tag"-*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wordstats/
    permissions:
      id-token: write # lets PyPI verify this run's identity (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
